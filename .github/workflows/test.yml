name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: node --test
      - name: Install and verify all host profiles
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdlc-smoke"
          node scripts/sdlc-install.mjs --target "$RUNNER_TEMP/sdlc-smoke" --platforms codex,opencode,copilot,claude,cursor
          node scripts/sdlc-doctor.mjs --target "$RUNNER_TEMP/sdlc-smoke" --platforms codex,opencode,copilot,claude,cursor
          node scripts/sdlc-install.mjs --target "$RUNNER_TEMP/sdlc-smoke" --platforms codex,opencode,copilot,claude,cursor
          node scripts/sdlc-uninstall.mjs --target "$RUNNER_TEMP/sdlc-smoke" --platforms codex,opencode,copilot,claude,cursor
          node scripts/sdlc-uninstall.mjs --target "$RUNNER_TEMP/sdlc-smoke" --platforms codex,opencode,copilot,claude,cursor --apply
